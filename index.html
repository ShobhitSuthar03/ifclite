<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFClite Desktop</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d10;
        transition: opacity 0.35s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-text {
        display: flex;
        font: 700 44px/1 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.35em;
        color: #f97316;
      }
      #splash .splash-text span {
        display: inline-block;
        opacity: 0.25;
        transform: translateY(6px);
        animation: splash-letter 1.1s ease-in-out infinite alternate;
      }
      @keyframes splash-letter {
        0% {
          opacity: 0.25;
          transform: translateY(6px);
          text-shadow: 0 0 0 rgba(249, 115, 22, 0);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          text-shadow: 0 0 18px rgba(249, 115, 22, 0.65);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ifclite.theme')
          if (theme === 'light') document.documentElement.classList.remove('dark')
          else document.documentElement.classList.add('dark')
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
          document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="splash-text">
        <span style="animation-delay: 0s">V</span>
        <span style="animation-delay: 0.1s">E</span>
        <span style="animation-delay: 0.2s">R</span>
        <span style="animation-delay: 0.3s">B</span>
        <span style="animation-delay: 0.4s">I</span>
        <span style="animation-delay: 0.5s">M</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
