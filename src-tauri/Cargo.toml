[package]
name = "ifclite-desktop"
version = "0.1.0"
description = "Tauri desktop shell implementing the IFClite NativeBridge host command contract"
authors = ["IFClite Desktop"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ifclite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
ifc-lite-processing = "15.1"
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# `tauri dev` uses the debug profile. Leave the app crate unoptimized for
# rebuild speed, but compile the tessellator at -O3 or large models crawl.
[profile.dev.package.ifc-lite-processing]
opt-level = 3
